<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글귀 컬렉션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html {
  background: #1e1e1e;
}

:root {
  --bg: #1e1e1e;
  --bg2: #272727;
  --card: #2e2e2e;
  --card-border: #3a3a3a;
  --neon-green: #b6ff00;
  --neon-pink: #ff2d78;
  --neon-cyan: #00f5ff;
  --neon-yellow: #ffe600;
  --neon-purple: #bf5fff;
  --text: #e8e8f0;
  --text-dim: #5a5a7a;
}

body {
  background: var(--bg);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 120px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(182,255,0,0.04) 0%, transparent 70%);
  top: -200px; left: -200px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(255,45,120,0.04) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  pointer-events: none;
  z-index: 0;
}

header {
  padding: 48px 24px 28px;
  max-width: 720px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  background: var(--bg);
}

.header-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1;
}
h1 span {
  color: var(--neon-green);
  text-shadow: 0 0 20px rgba(182,255,0,0.6);
}

.header-actions { display: flex; gap: 10px; align-items: center; }

.btn-add {
  display: flex; align-items: center; gap: 8px;
  background: var(--neon-green); color: #0a0a0f;
  border: none;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem; font-weight: 600;
  padding: 10px 20px; cursor: pointer; border-radius: 4px;
  letter-spacing: 0.05em;
  transition: all 0.2s;
  box-shadow: 0 0 20px rgba(182,255,0,0.3);
  white-space: nowrap;
}
.btn-add:hover { box-shadow: 0 0 32px rgba(182,255,0,0.6); transform: translateY(-1px); }

.btn-edit-mode {
  background: transparent; color: #aaaaaa;
  border: 1px solid #444444;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem; font-weight: 400;
  padding: 10px 18px; cursor: pointer; border-radius: 4px;
  transition: all 0.2s; white-space: nowrap;
}
.btn-edit-mode.active { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 16px rgba(255,45,120,0.2); }
.btn-edit-mode:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

.stats { margin-top: 16px; display: flex; align-items: center; gap: 14px; }
.stat-text { font-size: 0.72rem; color: #aaaaaa; letter-spacing: 0.1em; font-family: 'Space Grotesk', sans-serif; }
.progress-track { flex:1; max-width:200px; height:2px; background:var(--card-border); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background: linear-gradient(to right, var(--neon-green), var(--neon-cyan)); border-radius:2px; transition:width 0.5s ease; box-shadow:0 0 8px rgba(182,255,0,0.5); }

/* EMPTY */
.empty-state { text-align:center; padding:80px 24px; color:var(--text-dim); }
.empty-icon { font-size:3rem; margin-bottom:16px; opacity:0.3; }
.empty-state p { font-size:0.9rem; line-height:1.9; }
.empty-state strong { color:var(--neon-green); }

/* GRID */
.quotes-grid {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.quote-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-left-width: 3px;
  border-radius: 4px;
  padding: 24px 24px 18px;
  position: relative;
  transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  animation: slideIn 0.4s ease both;
}
.quote-card:nth-child(5n+1) { border-left-color: var(--neon-green); --nc: var(--neon-green); }
.quote-card:nth-child(5n+2) { border-left-color: var(--neon-cyan);  --nc: var(--neon-cyan); }
.quote-card:nth-child(5n+3) { border-left-color: var(--neon-pink);  --nc: var(--neon-pink); }
.quote-card:nth-child(5n+4) { border-left-color: var(--neon-yellow);--nc: var(--neon-yellow); }
.quote-card:nth-child(5n+5) { border-left-color: var(--neon-purple);--nc: var(--neon-purple); }

.quote-card:hover:not(.read) { background: #16161f; }
.quote-card.read {
  border-width: 1px 1px 1px 3px;
}
.quote-card.read .quote-text-inner {
  filter: brightness(1.7) saturate(1.5);
  text-shadow: 0 0 24px currentColor, 0 0 50px currentColor !important;
  animation: neonPulse 2.2s ease-in-out infinite;
}
@keyframes neonPulse {
  0%,100% { opacity:1; }
  50% { opacity:0.7; }
}

@keyframes slideIn {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}

.card-body { cursor: pointer; user-select: none; }
.edit-mode-on .card-body { cursor: default; pointer-events: none; }

.quote-text {
  font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  font-weight: 300;
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 14px;
  word-break: keep-all;
}

.quote-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; }

.quote-author {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.78rem;
  color: var(--nc, var(--neon-green));
  letter-spacing: 0.05em;
  opacity: 0.75;
  font-style: italic;
}

.read-tag {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  color: var(--neon-yellow);
  text-shadow: 0 0 8px rgba(255,230,0,0.7);
  opacity: 0;
  transition: opacity 0.3s;
}
.quote-card.read .read-tag { opacity: 1; }

/* 편집 버튼 */
.card-edit-actions {
  display: none;
  position: absolute;
  top: 12px; right: 12px;
  gap: 6px;
}
.edit-mode-on .card-edit-actions { display: flex; }

.btn-icon {
  width: 30px; height: 30px;
  border-radius: 3px; border: none;
  cursor: pointer; font-size: 0.78rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-modify { background: rgba(0,245,255,0.1); color: var(--neon-cyan); border: 1px solid rgba(0,245,255,0.2); }
.btn-modify:hover { background: rgba(0,245,255,0.2); box-shadow: 0 0 10px rgba(0,245,255,0.3); }
.btn-delete { background: rgba(255,45,120,0.1); color: var(--neon-pink); border: 1px solid rgba(255,45,120,0.2); }
.btn-delete:hover { background: rgba(255,45,120,0.2); box-shadow: 0 0 10px rgba(255,45,120,0.3); }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(5,5,10,0.85);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--card-border);
  border-top: 2px solid var(--neon-green);
  border-radius: 6px;
  padding: 32px;
  width: 100%; max-width: 520px;
  animation: modalIn 0.25s ease;
  box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 30px rgba(182,255,0,0.06);
}
@keyframes modalIn {
  from { opacity:0; transform:scale(0.94) translateY(16px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.modal h2 { font-family:'Space Grotesk',sans-serif; font-size:1.1rem; color:var(--text); margin-bottom:24px; font-weight:600; }
.modal h2 span { color: var(--neon-green); }

.form-group { margin-bottom: 16px; }
.form-group label { display:block; font-size:0.72rem; color:var(--text-dim); letter-spacing:0.12em; margin-bottom:8px; font-family:'Space Grotesk',sans-serif; }

.form-group textarea,
.form-group input {
  width: 100%;
  background: #222222;
  border: 1px solid var(--card-border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.92rem;
  padding: 12px 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  resize: none;
}
.form-group textarea { height: 130px; line-height: 1.8; }
.form-group textarea:focus,
.form-group input:focus { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(182,255,0,0.1); }
.form-group textarea.error { border-color: var(--neon-pink) !important; }

.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }

.btn-cancel { background:transparent; border:1px solid var(--card-border); color:var(--text-dim); font-family:'Space Grotesk',sans-serif; font-size:0.82rem; padding:10px 20px; cursor:pointer; border-radius:3px; transition:all 0.2s; }
.btn-cancel:hover { border-color:var(--text-dim); color:var(--text); }

.btn-save { background:var(--neon-green); border:none; color:#0a0a0f; font-family:'Space Grotesk',sans-serif; font-size:0.82rem; font-weight:600; padding:10px 26px; cursor:pointer; border-radius:3px; transition:all 0.2s; box-shadow:0 0 16px rgba(182,255,0,0.3); }
.btn-save:hover { box-shadow:0 0 26px rgba(182,255,0,0.55); transform:translateY(-1px); }

/* CONFIRM */
.confirm-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(5,5,10,0.9);
  backdrop-filter: blur(8px);
  z-index: 1100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.confirm-overlay.open { display: flex; }

.confirm-box {
  background: var(--bg2);
  border: 1px solid rgba(255,45,120,0.3);
  border-top: 2px solid var(--neon-pink);
  border-radius: 6px;
  padding: 28px;
  max-width: 340px; width: 100%;
  text-align: center;
  animation: modalIn 0.2s ease;
  box-shadow: 0 0 40px rgba(255,45,120,0.1);
}
.confirm-box p { color:var(--text); font-size:0.9rem; line-height:1.7; margin-bottom:24px; }
.confirm-box strong { color:var(--neon-pink); }
.confirm-actions { display:flex; gap:10px; justify-content:center; }

.btn-confirm-delete { background:var(--neon-pink); border:none; color:#fff; font-family:'Space Grotesk',sans-serif; font-size:0.82rem; font-weight:600; padding:10px 22px; cursor:pointer; border-radius:3px; transition:all 0.2s; box-shadow:0 0 14px rgba(255,45,120,0.3); }
.btn-confirm-delete:hover { box-shadow:0 0 24px rgba(255,45,120,0.55); }

@media (max-width:480px) {
  .quote-card { padding:20px 18px 16px; }
  .btn-add, .btn-edit-mode { padding:9px 14px; font-size:0.8rem; }
  .modal { padding:24px; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1><span style="color:var(--neon-pink);text-shadow:0 0 20px rgba(255,45,120,0.6);">매일 읽고,</span> <span style="color:var(--neon-green);text-shadow:0 0 20px rgba(182,255,0,0.6);">매일 실천</span></h1>
    <div class="header-actions">
      <button class="btn-edit-mode" id="btnEditMode" onclick="toggleEditMode()">✏️ 편집</button>
      <button class="btn-add" onclick="openModal()">＋ 추가</button>
    </div>
  </div>
  <div class="stats">
    <span class="stat-text" id="statText">글귀 0개</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="stat-text" id="statRead">0 읽음</span>
  </div>
</header>

<div class="quotes-grid" id="quotesGrid"></div>

<!-- 추가/수정 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">새 글귀 <span>추가</span></h2>
    <div class="form-group">
      <label>글귀 내용 *</label>
      <textarea id="inputText" placeholder="마음에 드는 글귀를 입력하세요..."></textarea>
    </div>
    <div class="form-group">
      <label>출처 / 저자 (선택)</label>
      <input type="text" id="inputAuthor" placeholder="예) 헤르만 헤세, 데미안">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveQuote()">저장</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p>이 글귀를 <strong>삭제</strong>할까요?<br>복구할 수 없어요.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">취소</button>
      <button class="btn-confirm-delete" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'my_quotes_v2';
let editMode = false;
let editingIndex = null;
let deletingIndex = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function save(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} 
}

function render() {
  const data = load();
  const grid = document.getElementById('quotesGrid');

  if (data.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <p>아직 글귀가 없어요.<br><strong>＋ 추가</strong> 버튼을 눌러 첫 글귀를 저장해보세요.</p>
      </div>`;
    updateStats(data);
    return;
  }

  grid.innerHTML = data.map((q, i) => `
    <div class="quote-card ${q.read ? 'read' : ''}">
      <div class="card-edit-actions">
        <button class="btn-icon btn-modify" onclick="openEdit(${i})" title="수정">✎</button>
        <button class="btn-icon btn-delete" onclick="askDelete(${i})" title="삭제">✕</button>
      </div>
      <div class="card-body" onclick="toggleRead(${i})">
        <p class="quote-text"><span class="quote-text-inner" style="color:${i % 2 === 0 ? 'var(--neon-pink)' : 'var(--neon-green)'}; text-shadow:0 0 18px ${i % 2 === 0 ? 'rgba(255,45,120,0.5)' : 'rgba(182,255,0,0.5)'};">${esc(q.text)}</span></p>
        <div class="quote-footer">
          <span class="quote-author">${q.author ? '— ' + esc(q.author) : ''}</span>
          <span class="read-tag">✓ 읽음</span>
        </div>
      </div>
    </div>
  `).join('');

  if (editMode) grid.classList.add('edit-mode-on');
  else grid.classList.remove('edit-mode-on');

  updateStats(data);
}

function updateStats(data) {
  const total = data.length;
  const readCount = data.filter(q => q.read).length;
  document.getElementById('statText').textContent = `다짐 ${total}개`;
  document.getElementById('statRead').textContent = `${readCount} 읽음`;
  document.getElementById('progressFill').style.width = total ? `${(readCount/total)*100}%` : '0%';
}

function toggleRead(i) {
  if (editMode) return;
  const data = load();
  data[i].read = !data[i].read;
  save(data);
  render();
}

// 자정 초기화
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function checkMidnightReset() {
  const lastDate = localStorage.getItem('quotes_last_date');
  const today = getTodayStr();
  if (lastDate !== today) {
    // 날짜 바뀜 → read 상태 초기화
    const data = load();
    data.forEach(q => q.read = false);
    save(data);
    localStorage.setItem('quotes_last_date', today);
    render();
  }
}

// 앱 열릴 때 체크
checkMidnightReset();

// 탭이 다시 활성화될 때도 체크 (핸드폰에서 앱 복귀 시)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkMidnightReset();
});

// 자정에 정확히 초기화되도록 타이머 설정
function scheduleNextMidnight() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  const msUntilMidnight = midnight - now;
  setTimeout(() => {
    checkMidnightReset();
    scheduleNextMidnight(); // 다음 자정 예약
  }, msUntilMidnight);
}
scheduleNextMidnight();

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('btnEditMode');
  const grid = document.getElementById('quotesGrid');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✓ 완료' : '✏️ 편집';
  grid.classList.toggle('edit-mode-on', editMode);
}

function openModal() {
  editingIndex = null;
  document.getElementById('modalTitle').innerHTML = '새 글귀 <span>추가</span>';
  document.getElementById('inputText').value = '';
  document.getElementById('inputAuthor').value = '';
  document.getElementById('inputText').classList.remove('error');
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('inputText').focus(), 120);
}

function openEdit(i) {
  const data = load();
  editingIndex = i;
  document.getElementById('modalTitle').innerHTML = '글귀 <span>수정</span>';
  document.getElementById('inputText').value = data[i].text;
  document.getElementById('inputAuthor').value = data[i].author || '';
  document.getElementById('inputText').classList.remove('error');
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('inputText').focus(), 120);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingIndex = null;
}

function saveQuote() {
  const textEl = document.getElementById('inputText');
  const text = textEl.value.trim();
  const author = document.getElementById('inputAuthor').value.trim();
  if (!text) {
    textEl.classList.add('error');
    textEl.focus();
    setTimeout(() => textEl.classList.remove('error'), 1400);
    return;
  }
  const data = load();
  if (editingIndex !== null) {
    data[editingIndex].text = text;
    data[editingIndex].author = author;
  } else {
    data.push({ text, author, read: false });
  }
  save(data);
  closeModal();
  render();
}

function askDelete(i) {
  deletingIndex = i;
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  deletingIndex = null;
}

function confirmDelete() {
  if (deletingIndex === null) return;
  const data = load();
  data.splice(deletingIndex, 1);
  save(data);
  closeConfirm();
  render();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('confirmOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirmOverlay')) closeConfirm();
});

render();
</script>
</body>
</html>
